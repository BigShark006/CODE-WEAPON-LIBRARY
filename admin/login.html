<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập Admin - BIGSHARK</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦈</text></svg>" />
  <link rel="stylesheet" href="/src/css/main.css" />
  <link rel="stylesheet" href="/src/css/admin.css" />
</head>
<body>

  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-main">BIGSHARK</div>
        <div class="logo-sub">WEAPON CODES</div>
      </div>

      <h1 class="login-title">Đăng nhập Admin</h1>

      <div class="alert alert-error alert-hidden" id="loginAlert" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input
            type="email"
            class="form-input"
            id="email"
            name="email"
            placeholder="admin@example.com"
            autocomplete="email"
            required
          />
          <div class="form-error" id="emailError"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Mật khẩu</label>
          <input
            type="password"
            class="form-input"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
          <div class="form-error" id="passwordError"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
          Đăng nhập
        </button>
      </form>

      <div style="text-align:center;margin-top:20px">
        <a href="/" style="font-size:0.8rem;color:var(--text-secondary);text-decoration:none" aria-label="Quay về trang chủ">
          ← Về trang chủ
        </a>
      </div>
    </div>
  </div>

  <script type="module">
    import { signIn, getSession, isAdmin } from '/src/js/auth.js';

    // Check if already logged in as admin
    (async () => {
      try {
        const session = await getSession();
        if (session) {
          const admin = await isAdmin();
          if (admin) {
            window.location.href = '/admin/index.html';
            return;
          }
        }
      } catch { /* proceed to login */ }

      // Handle error in URL
      const params = new URLSearchParams(window.location.search);
      if (params.get('error') === 'unauthorized') {
        showAlert('Tài khoản không có quyền truy cập khu vực quản trị.');
      }
    })();

    function showAlert(message) {
      const alert = document.getElementById('loginAlert');
      alert.textContent = message;
      alert.classList.remove('alert-hidden');
    }

    function hideAlert() {
      document.getElementById('loginAlert').classList.add('alert-hidden');
    }

    const form = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // Basic validation
      let valid = true;
      if (!email) {
        document.getElementById('emailError').textContent = 'Vui lòng nhập email.';
        document.getElementById('emailError').classList.add('visible');
        document.getElementById('email').classList.add('error');
        valid = false;
      } else {
        document.getElementById('emailError').classList.remove('visible');
        document.getElementById('email').classList.remove('error');
      }

      if (!password) {
        document.getElementById('passwordError').textContent = 'Vui lòng nhập mật khẩu.';
        document.getElementById('passwordError').classList.add('visible');
        document.getElementById('password').classList.add('error');
        valid = false;
      } else {
        document.getElementById('passwordError').classList.remove('visible');
        document.getElementById('password').classList.remove('error');
      }

      if (!valid) return;

      loginBtn.disabled = true;
      loginBtn.textContent = 'Đang đăng nhập...';

      try {
        await signIn(email, password);

        // Verify admin role server-side
        const admin = await isAdmin();
        if (!admin) {
          // Signed in but not admin - sign out
          const { signOut } = await import('/src/js/auth.js');
          await signOut();
          showAlert('Tài khoản này không có quyền quản trị. Liên hệ chủ sở hữu website.');
          return;
        }

        window.location.href = '/admin/index.html';
      } catch (err) {
        let message = 'Đăng nhập thất bại. Vui lòng thử lại.';
        if (err.message.includes('Invalid login credentials')) {
          message = 'Email hoặc mật khẩu không chính xác.';
        } else if (err.message.includes('Email not confirmed')) {
          message = 'Email chưa được xác nhận.';
        } else if (err.message.includes('Too many requests')) {
          message = 'Quá nhiều lần thử. Vui lòng đợi vài phút.';
        } else if (err.message.includes('cấu hình')) {
          message = err.message;
        }
        showAlert(message);
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Đăng nhập';
      }
    });
  </script>

</body>
</html>
